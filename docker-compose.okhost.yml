# Прод на общем сервере okhost (193.17.95.54).
#
# Запускать ТОЛЬКО этим файлом, без базового docker-compose.yml:
#
#   docker compose -f docker-compose.okhost.yml up -d --build
#
# Так и делает `okhost rebuild my-posting`.
#
# Почему отдельный файл, а не слой поверх базового. На okhost один Postgres на все
# проекты и один Caddy на весь сервер, а базовый compose поднимает и то, и другое
# своё. Слоем это не выключить: docker compose объединяет сервисы, а не заменяет их —
# `postgres` и `caddy` из базового файла всё равно поднялись бы, второй Caddy занял бы
# 80 и 443 и уронил бы соседей по серверу. Поэтому здесь описан весь стек проекта,
# и состоит он из одного контейнера.
#
# Реквизиты БД приходят из .env.infra: его пишет okhost при заведении проекта,
# в git его нет. Секреты приложения — в .env рядом. Порядок в env_file важен:
# .env читается вторым и может переопределить .env.infra.

services:
  app:
    build:
      context: .
      target: prod
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    # Имя фиксированное: на него ссылается конфиг Caddy, который генерит `okhost web`.
    container_name: my-posting-app
    restart: unless-stopped
    env_file:
      - .env.infra
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_PRETTY: ${LOG_PRETTY:-false}
      # Короткий хеш выкаченного коммита. Виден в подвале панели — по нему на глаз
      # проверяется, что автодеплой действительно доехал.
      APP_REVISION: ${APP_REVISION:-}
      TZ: Europe/Moscow
    networks:
      # data — доступ к общим Postgres и Redis, интернета в этой сети нет.
      # edge — через неё Caddy ходит в контейнер. Без неё домен отдаст 502.
      - data
      - edge
    volumes:
      # Обложки должны пережить пересборку образа: postmypost скачивает их по ссылке
      # уже после публикации, а перегенерация каждой стоит 6 кредитов kie.ai.
      - media:/app/media
    # Потолок памяти обязателен: без него потёкший проект уронит соседей по серверу.
    # 512 МБ — с запасом, наблюдаемое потребление втрое меньше.
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  data:
    external: true
  edge:
    external: true

volumes:
  media:
