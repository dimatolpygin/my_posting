name: Деплой на прод

# Только master: dev — рабочая ветка, её пуши прод не трогают.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Два выката одновременно подрались бы за docker build: сервер общий, ядер немного.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ключ доступа к серверу
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SERVER_PORT || 22 }}" -H "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Выкат
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || 22 }}
          DIR: ${{ secrets.INSTALL_DIR || '/opt/projects/my-posting' }}
        run: |
          # Сборка идёт на сервере: образ лёгкий (node:22-alpine + npm ci --omit=dev),
          # укладывается в минуту и не стоит возни с реестром образов.
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "cd $DIR && ./deploy/deploy.sh --pull"

      - name: Проверка, что прод отвечает
        env:
          URL: ${{ secrets.PUBLIC_URL || 'https://anastasia-kwork.ru' }}
        run: |
          # /health открыт без авторизации — по нему и проверяем живость снаружи.
          curl -fsS --retry 5 --retry-delay 5 --max-time 20 "$URL/health" | head -c 400
